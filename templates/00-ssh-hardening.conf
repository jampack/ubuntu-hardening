# ====================================
# SSH NETWORK CONFIGURATION
# ====================================

# Port is recorded here for daemon consistency and Match/context checks.
# When ssh.socket is active (Ubuntu default), the systemd socket ListenStream
# controls the TCP listen port — see ssh_port module.
Port SSH_PORT
AddressFamily any

# ====================================
# AUTHENTICATION HARDENING
# ====================================

PermitRootLogin no
PasswordAuthentication no
PubkeyAuthentication yes
KbdInteractiveAuthentication no
PermitEmptyPasswords no

# ====================================
# CONNECTION LIMITS
# ====================================

LoginGraceTime 30
MaxAuthTries 3
MaxSessions 2
MaxStartups 10:30:60

# ====================================
# SESSION MANAGEMENT
# ====================================

ClientAliveInterval 300
ClientAliveCountMax 2
LogLevel VERBOSE
TCPKeepAlive no

# ====================================
# FORWARDING RESTRICTIONS
# ====================================

X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
PermitTunnel no
GatewayPorts no
AllowStreamLocalForwarding no

# ====================================
# ADDITIONAL SECURITY
# ====================================

PermitUserEnvironment no
IgnoreRhosts yes
HostbasedAuthentication no
GSSAPIAuthentication no

# ====================================
# CRYPTOGRAPHIC POLICY (OPTIONAL)
# ====================================
# Prefer Ubuntu/OpenSSH defaults unless policy requires otherwise.
# MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com
